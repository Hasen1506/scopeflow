# Manual release. Migrations run as the owner role, then Koyeb builds the same
# commit. There is no push trigger: a push deploy would start before migrate.
# In the Koyeb service, leave "deploy on git push" off (`--git-no-deploy-on-push`
# in scripts/koyeb-create.sh).
name: Deploy to Koyeb

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Commit to migrate and deploy. Empty uses the selected ref.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: scopeflow-koyeb-deploy
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KOYEB_APP: ${{ vars.KOYEB_APP || 'scopeflow' }}
      KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE || 'scopeflow' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Migrate
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_MIGRATION_URL}" ]; then
            echo "::error title=Migration URL missing::Set repository secret DATABASE_MIGRATION_URL to the owner-role connection before deploying."
            exit 1
          fi
          npm run db:migrate:deploy
      - name: Install Koyeb CLI
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"
      - name: Redeploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          if [ -z "${KOYEB_TOKEN}" ]; then
            echo "::error title=Koyeb token missing::Set repository secret KOYEB_TOKEN. Create the service once with scripts/koyeb-create.sh before the first deploy."
            exit 1
          fi
          sha="${{ inputs.git_sha || github.sha }}"
          koyeb services update "${KOYEB_APP}/${KOYEB_SERVICE}" \
            --token "$KOYEB_TOKEN" \
            --git github.com/Hasen1506/scopeflow \
            --git-branch "${GITHUB_REF_NAME}" \
            --git-sha "$sha" \
            --git-builder docker \
            --git-docker-dockerfile Dockerfile \
            --git-no-deploy-on-push \
            --wait \
            --wait-timeout 30m
