name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scopeflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/scopeflow_test
      NEON_AUTH_BASE_URL: http://localhost:55433
      NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-0123456789abcdef0123
      APP_URL: http://localhost:5173
      # PR F: test-only webhook secret so tests/payments.mjs exercises the verified webhook path.
      # No RAZORPAY_KEY_ID/SECRET: online deposits stay disabled, which the suite also asserts.
      RAZORPAY_WEBHOOK_SECRET: ci-only-razorpay-webhook-secret
      # PR B: no mail provider in CI, so one-time codes are logged to this file instead of emailed
      # (dev mode is refused unless APP_URL is localhost). tests/otp.mjs reads them from here.
      SCOPEFLOW_OTP_DEV: '1'
      SCOPEFLOW_OTP_DEV_LOG: /tmp/scopeflow-otp-dev.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --include=dev --include=optional
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - name: Property-based, golden and differential tests (pure, no server)
        run: npm run test:props
      - run: npm run build
      - run: npm run db:migrate
      - name: Start the local auth fixture and the production build
        run: |
          node tests/support/auth-service.mjs > auth.log 2>&1 &
          npx next start --hostname localhost --port 5173 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5173/api/health && break; sleep 1; done
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:55433/ok && break; sleep 1; done
      # Runs first, on the fresh database and auth fixture. No retries, no quarantine.
      - name: Golden E2E (Playwright)
        run: npm run test:e2e
      - run: npm run test:local
      - name: Live property and differential tests (API, database triggers)
        run: npm run test:live
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
