name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A new push to the same branch or pull request cancels the run already in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # ubuntu-latest moves to Ubuntu 26 starting 19 Oct 2026. Playwright 1.56.1
    # installs Chromium dependencies for 24.04; stay on that image so the
    # browser install and the visual comparison do not move with the runner.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scopeflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/scopeflow_test
      NEON_AUTH_BASE_URL: http://localhost:55433
      NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-0123456789abcdef0123
      # Production builds no longer sign records with the cookie secret, so CI sets a dedicated one.
      SCOPEFLOW_SIGNING_SECRET: ci-only-signing-secret-0123456789abcdef0123
      APP_URL: http://localhost:5173
      # PR F: test-only webhook secret so tests/payments.mjs exercises the verified webhook path.
      # No RAZORPAY_KEY_ID/SECRET: online deposits stay disabled, which the suite also asserts.
      RAZORPAY_WEBHOOK_SECRET: ci-only-razorpay-webhook-secret
      # PR B: no mail provider in CI, so one-time codes are logged to this file instead of emailed
      # (dev mode is refused unless APP_URL is localhost). tests/otp.mjs reads them from here.
      SCOPEFLOW_OTP_DEV: '1'
      SCOPEFLOW_OTP_DEV_LOG: /tmp/scopeflow-otp-dev.log
      # Local RFC 3161 authority and a throwaway PDF signing certificate (created below).
      SCOPEFLOW_TSA_URL: http://127.0.0.1:55434/
      SCOPEFLOW_PDF_SIGN_CERT: /tmp/scopeflow-sign.crt
      SCOPEFLOW_PDF_SIGN_KEY: /tmp/scopeflow-sign.key
      # Reference rates from the same local service; the reconciliation route's bearer secret.
      SCOPEFLOW_FX_URL: http://127.0.0.1:55434/fx
      # WS-10 for WS-01: FBIL reference rates from the same local double (v2 shape), never the public API.
      SCOPEFLOW_FBIL_URL: http://127.0.0.1:55434/fbil
      SCOPEFLOW_CRON_SECRET: ci-only-cron-secret
      # Stripe test double (EUR and GBP only, so the INR deposit suite still sees payments off), the
      # embeddings double for the meaning-match radar, and email forwarding into the radar.
      STRIPE_SECRET_KEY: sk_test_ci_only
      STRIPE_WEBHOOK_SECRET: whsec_ci_only
      STRIPE_API_URL: http://127.0.0.1:55434/stripe
      STRIPE_CURRENCIES: EUR,GBP
      SCOPEFLOW_EMBEDDINGS: voyage
      VOYAGE_API_KEY: ci-only-voyage-key
      SCOPEFLOW_EMBEDDINGS_URL: http://127.0.0.1:55434/embeddings
      SCOPEFLOW_INBOUND_DOMAIN: in.scopeflow.test
      SCOPEFLOW_INBOUND_SECRET: ci-only-inbound-secret-0123
      # WS-10 (H3): behind one trusted proxy, like Render; the client is the right-most X-Forwarded-For hop.
      SCOPEFLOW_TRUSTED_HOPS: '1'
    steps:
      - uses: actions/checkout@v5
      - id: scope
        name: Skip heavy jobs for docs-only changes
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "browser=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --no-tags --depth=1 origin "$before"
            range="$before"
          fi
          files="$(git diff --name-only "$range" HEAD)"
          code=false
          if [ -n "$files" ]; then
            other="$(printf '%s\n' "$files" | grep -Ev '^(docs/|[^/]*\.md$|.*/[^/]*\.md$)' || true)"
            if [ -n "$other" ]; then code=true; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ] && [ "$code" = "true" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$code"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --include=dev --include=optional
      - name: Cache Playwright browsers
        if: steps.scope.outputs.browser == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for Playwright
        if: steps.scope.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium
      - name: Install poppler (pdfsig, pdftotext and pdftoppm verify the signed and Unicode PDFs)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm run typecheck
      - run: npm run lint
      - name: Property-based, golden and differential tests (pure, no server)
        run: npm run test:props
      # WS-10 (L14): every matrix item of a landed workstream needs a test tagged @covers <ID>.
      - name: Coverage gate (@covers tags)
        run: node scripts/check-coverage.mjs
      # WS-10 (L10): the production build must fit a 512 MB instance (460 MB heap cap).
      - name: Build under the memory cap
        if: steps.scope.outputs.code == 'true'
        run: npm run build:capped
      - if: steps.scope.outputs.code == 'true'
        run: npm run db:migrate
      - name: Throwaway PDF signing certificate
        if: steps.scope.outputs.code == 'true'
        run: openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/scopeflow-sign.key -out /tmp/scopeflow-sign.crt -days 7 -subj "/CN=Scopeflow CI Signer"
      - name: Start the local auth fixture and the production build
        if: steps.scope.outputs.code == 'true'
        run: |
          node tests/support/tsa-service.mjs > tsa.log 2>&1 &
          node tests/support/auth-service.mjs > auth.log 2>&1 &
          node scripts/start.mjs > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5173/api/health && break; sleep 1; done
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:55433/ok && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:55434/ && break; sleep 1; done
      # Runs first, on the fresh database and auth fixture. No retries, no quarantine. Includes the
      # Pixel 7 / iPhone 13 mobile projects (playwright.config.ts). Screenshot specs are not in
      # this command; they compare committed baselines inside the pinned Playwright image.
      - name: Golden E2E (Playwright, desktop and mobile)
        if: steps.scope.outputs.browser == 'true'
        run: npm run test:e2e
      - name: Visual baselines (compare only, mcr.microsoft.com/playwright pinned to @playwright/test)
        if: steps.scope.outputs.browser == 'true'
        run: npm run test:visual
      - if: steps.scope.outputs.code == 'true'
        run: npm run test:local
      - name: Live property and differential tests (API, database triggers)
        if: steps.scope.outputs.code == 'true'
        run: npm run test:live
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
